type: image
backend: torch
class_name: CNNImageModel
params:
  encoder: efficientnet_b0
  image_size: 384
  pretrained: true
  loss: weighted_bce
  max_pos_weight: 100.0
  use_focal: false
  epochs: 30
  patience: 10
  learning_rate: 1.0e-4
  backbone_lr_scale: 0.1
  weight_decay: 1.0e-4
  batch_size: 32
  dropout: 0.3
  warmup_epochs: 5
  grad_clip_norm: 1.0
  seed: 2026
