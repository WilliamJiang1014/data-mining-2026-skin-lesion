type: image_transformer
backend: torch
class_name: TransformerImageModel
params:
  encoder: swin_tiny_patch4_window7_224
  image_size: 384
  pretrained: true
  loss: focal
  focal_alpha: 0.25
  focal_gamma: 2.0
  max_pos_weight: 100.0
  epochs: 30
  patience: 10
  learning_rate: 5.0e-5
  backbone_lr_scale: 0.1
  weight_decay: 0.05
  batch_size: 16
  dropout: 0.3
  warmup_epochs: 5
  grad_clip_norm: 1.0
  seed: 2026
